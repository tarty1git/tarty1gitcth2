# Ollama (runs the LLM), Open WebUI (the chat interface) and, optionally, Caddy (HTTPS).
# Everything runs in Docker. Settings live in .env (copy .env.example); setup.sh does it for you.
#
#   docker compose up -d                     start (the first start downloads the model)
#   docker compose logs -f models            watch the model download
#   docker compose exec ollama ollama pull llama3.1:8b    add a model
#
# Only Open WebUI publishes a port, and by default only on 127.0.0.1 of this machine.
# Ollama has no login, so it publishes no port: only the other containers can reach it.
name: open-webui

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama
    restart: always
    environment:
      # How long a model stays loaded in memory after the last request.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama:/root/.ollama          # downloaded models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot job: downloads the models listed in MODELS, then exits.
  # Runs again on every 'up'; models already downloaded are only checked for updates.
  models:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: ollama-models
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${MODELS:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in $$MODELS; do
          echo "Pulling model $$m"
          ollama pull "$$m" || { echo "ERROR: could not pull $$m"; exit 1; }
        done
        echo "All models ready: $$MODELS"

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_VERSION:-main}
    container_name: open-webui
    restart: always
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      # 127.0.0.1 = this machine only. Set WEBUI_BIND=0.0.0.0 in .env to open it to
      # the network (Docker-published ports skip UFW, so then your firewall won't block it).
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    environment:
      # Used only on the very first start. After that, the URL saved in
      # Admin Settings > Connections wins (setup.sh repairs known-bad values).
      OLLAMA_BASE_URL: http://ollama:11434
      # Every signed-in user sees every model. Without this, Open WebUI shows
      # models only to admins until you share each one in Admin Settings > Models.
      BYPASS_MODEL_ACCESS_CONTROL: "True"
      # Hide the built-in OpenAI connection (it has no key and only logs errors).
      ENABLE_OPENAI_API: "False"
      # Keep the session-signing key in the data volume, so updates don't log everyone out.
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
    volumes:
      - open-webui:/app/backend/data  # accounts, chats, settings

  # HTTPS for your team. Turn on with COMPOSE_PROFILES=https and DOMAIN=... in .env.
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    profiles: ["https"]
    depends_on:
      - open-webui
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # certificates
      - caddy-config:/config

volumes:
  ollama:
    name: ollama
  open-webui:
    # Same name as earlier versions of these files and the plain 'docker run' command,
    # so existing accounts and chats carry over.
    name: open-webui
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
